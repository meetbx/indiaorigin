
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production 
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.production
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "MSG91_AUTH_KEY=$MSG91_AUTH_KEY" >> .env.production
        - echo "MSG91_TEMPLATE_ID=$MSG91_TEMPLATE_ID" >> .env.production
        - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env.production
        - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env.production
        - echo "ABLY_API_KEY=$ABLY_API_KEY" >> .env.production
        - echo "CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY" >> .env.production
        - echo "CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET" >> .env.production
        - echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" >> .env.production
        - echo "NEXT_PUBLIC_MSG91_WIDGET_ID=$NEXT_PUBLIC_MSG91_WIDGET_ID" >> .env.production
        - echo "NEXT_PUBLIC_MSG91_WIDGET_TOKEN=$NEXT_PUBLIC_MSG91_WIDGET_TOKEN" >> .env.production
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
